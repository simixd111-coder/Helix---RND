# Helix RND — Release Workflow
# Builds the library on Windows/Linux, packages headers + libs,
# computes SHA256 and creates a GitHub Release on tags (v*).

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CMAKE_GENERATOR: Ninja
  BUILD_TYPE: Release

permissions:
  contents: write
  id-token: write  # Required for Trusted Publishing (OIDC)

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            lib_files: |
              build/helix-core.lib
              build/helix-platform.lib
              build/helix-render-software.lib
          - os: ubuntu-latest
            platform: linux
            arch: x64
            lib_files: |
              build/libhelix-core.a
              build/libhelix-platform.a
              build/libhelix-render-software.a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G "${CMAKE_GENERATOR}" \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DHX_STATIC_RUNTIME=ON \
            -DHX_BUILD_TESTS=ON \
            -DHX_BUILD_HEADLESS_DEMO=ON \
            -DHX_BACKEND_VULKAN=OFF \
            -DHX_BACKEND_OPENGL=OFF \
            -DHX_BACKEND_SOFTWARE=ON

      - name: Build
        shell: bash
        run: cmake --build build --config ${BUILD_TYPE} --parallel

      - name: Run Tests
        shell: bash
        run: ctest --test-dir build --output-on-failure --parallel 1

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $zipName = "helix-rnd-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path "pkg/$zipName/include" | Out-Null
          New-Item -ItemType Directory -Force -Path "pkg/$zipName/lib" | Out-Null
          Copy-Item include/helix.h "pkg/$zipName/include/"
          Copy-Item build/helix-core.lib build/helix-platform.lib build/helix-render-software.lib "pkg/$zipName/lib/"
          Copy-Item LICENSE "pkg/$zipName/"
          Compress-Archive -Path "pkg/$zipName" -DestinationPath "pkg/$zipName.zip"
          $hash = (Get-FileHash "pkg/$zipName.zip" -Algorithm SHA256).Hash
          "$hash  $zipName.zip" | Out-File "pkg/$zipName.zip.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          version="${GITHUB_REF_NAME#v}"
          zipName="helix-rnd-$version-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "pkg/$zipName/include" "pkg/$zipName/lib"
          cp include/helix.h "pkg/$zipName/include/"
          cp build/libhelix-core.a build/libhelix-platform.a build/libhelix-render-software.a "pkg/$zipName/lib/"
          cp LICENSE "pkg/$zipName/"
          (cd pkg && zip -r "$zipName.zip" "$zipName")
          sha256sum "pkg/$zipName.zip" > "pkg/$zipName.zip.sha256"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pkg/*.zip
            pkg/*.sha256

  publish-nuget:
    name: Publish to NuGet
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install ninja cmake --no-progress

      - name: Configure CMake (Shared)
        run: |
          cmake -B build-shared -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DHX_BUILD_SHARED=ON `
            -DHX_BUILD_TESTS=OFF `
            -DHX_BUILD_HEADLESS_DEMO=OFF `
            -DHX_BACKEND_VULKAN=ON `
            -DHX_BACKEND_SOFTWARE=ON

      - name: Build Shared Library
        run: cmake --build build-shared --config Release --parallel

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Prepare NuGet Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $nuspecDir = "packaging/nuget/HelixRND"
          $runtimesDir = "$nuspecDir/runtimes/win-x64/native"
          
          # Create runtimes directory
          New-Item -ItemType Directory -Force -Path $runtimesDir | Out-Null
          
          # Copy the shared library
          Copy-Item build-shared/helix.dll $runtimesDir/
          
          # Pack the NuGet package
          dotnet pack $nuspecDir -c Release -o packaging/nuget/nupkg -p:Version=$version

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet (Trusted Publishing)
        run: |
          $nupkg = Get-ChildItem packaging/nuget/nupkg/*.nupkg | Select-Object -First 1
          dotnet nuget push $nupkg.FullName --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
