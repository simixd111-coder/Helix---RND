# Helix RND — GitHub Actions CI
# Build and test supported platforms: Windows and Linux

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CMAKE_GENERATOR: Ninja
  BUILD_TYPE: Release

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: helix-windows
            demo_exe: helix_demo_headless.exe
          - os: ubuntu-latest
            artifact_name: helix-linux
            demo_exe: helix_demo_headless
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G "${CMAKE_GENERATOR}" \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DHX_STATIC_RUNTIME=ON \
            -DHX_BUILD_TESTS=ON \
            -DHX_BUILD_HEADLESS_DEMO=ON \
            -DHX_BACKEND_SOFTWARE=ON \
            -DHX_BACKEND_VULKAN=OFF \
            -DHX_BACKEND_OPENGL=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config ${BUILD_TYPE} --parallel

      - name: Run Unit Tests
        shell: bash
        run: |
          cd build
          ctest --output-on-failure --parallel 1

      - name: Report failed CTest cases
        if: failure()
        shell: bash
        working-directory: build
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("Testing/Temporary/LastTest.log")
          if path.exists():
              text = path.read_text(errors="replace")
              for block in re.split(r"(?=^\d+/\d+ Testing:)", text, flags=re.M):
                  name = re.search(r"^\d+/\d+ Test: ([^\r\n]+)", block, flags=re.M)
                  if name and re.search(r"^Test Failed\.", block, flags=re.M):
                      detail = re.sub(r"\s+", " ", block).strip()
                      message = f"{name.group(1)}: {detail[-1200:]}"
                      for source, replacement in (("%", "%25"), ("\r", "%0D"), ("\n", "%0A"), (":", "%3A"), (",", "%2C")):
                          message = message.replace(source, replacement)
                      print(f"::error title=CTest failure::{message}")

      - name: Run Headless Demo
        shell: bash
        run: |
          cd build
          ./${{ matrix.demo_exe }}
          ls -la triangle.png

      - name: Upload Demo Output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-triangle
          path: build/triangle.png

      - name: Upload Binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-bin
          path: |
            build/helix-core.lib
            build/helix-platform.lib
            build/helix-render-software.lib
            build/helix_demo_headless.exe

      - name: Upload Binaries (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-bin
          path: |
            build/libhelix-core.a
            build/libhelix-platform.a
            build/libhelix-render-software.a
            build/helix_demo_headless

  # Sanitizer builds (Linux only)
  sanitizers:
    name: Sanitizers (Linux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - sanitizer: address
            cmake_option: ASAN
          - sanitizer: undefined
            cmake_option: UBSAN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev

      - name: Configure (${{ matrix.sanitizer }})
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHX_STATIC_RUNTIME=OFF \
            -DHX_BUILD_TESTS=ON \
            -DHX_BUILD_HEADLESS_DEMO=ON \
            -DHX_ENABLE_${{ matrix.cmake_option }}=ON

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure --parallel

  # Static Analysis
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Configure with compile commands
        run: cmake -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          cd build
          run-clang-tidy.py -p . -header-filter=.* -checks='*' -warnings-as-errors='*' 2>&1 | head -100

  # Release build verification
  release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [build-test, sanitizers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHX_STATIC_RUNTIME=ON \
            -DHX_BUILD_TESTS=OFF \
            -DHX_BUILD_HEADLESS_DEMO=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify binary size
        run: |
          ls -lh build/libhelix-core.a build/libhelix-platform.a build/libhelix-render-software.a build/helix_demo_headless

      - name: Create Release Package
        run: |
          mkdir -p release
          cp build/libhelix-core.a build/libhelix-platform.a build/libhelix-render-software.a release/
          cp build/helix_demo_headless release/
          cp include/helix.h release/
          cp LICENSE THIRD_PARTY_LICENSES.txt release/
          tar -czf helix-rnd-${{ github.sha }}-linux-x64.tar.gz -C release .

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-release-linux
          path: helix-rnd-*.tar.gz
